{# One panel: its title, its download, and the box that fetches its drawing -- once when #}
{# the page loads, again whenever a filter its query reads changes, the time range with it, #}
{# and at every refresh. #}
<section class="dashboards-panel{% if panel.wide %} wide{% endif %}" data-kind="{{ panel.kind }}">
    <header>
        <h2>{{ panel.title }}</h2>
        {% if panel.kind != "text" %}
            <a href="{% url 'dashboards:download' name panel.index %}" data-download
               title="Download for Excel" class="material-symbols-outlined md-18">download</a>
        {% endif %}
    </header>
    <div hx-get="{% url 'dashboards:panel' name panel.index %}" hx-include="#filters"
         hx-trigger="load, dashboards:refresh from:body{% for filter in panel.filters %}{% if filter == 'from' %}, dashboards:time from:body{% elif filter != 'to' %}, change from:[name='{{ filter }}']{% endif %}{% endfor %}"></div>
</section>
