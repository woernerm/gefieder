[project]
name = "crudman"
version = "0.1.0"
description = "Crudman is an administration panel for the analytics platform."
requires-python = ">=3.13"
dependencies = [
    "asyncssh",
    "Django",
    # The OpenID Connect client for single sign-on. The socialaccount extra carries the
    # generic openid_connect provider, which takes a list of issuers, so a second identity
    # provider is configuration rather than another dependency.
    "django-allauth[socialaccount]",
    "django-unfold",
    "fastexcel",
    "gunicorn",
    "polars",
    "pyarrow",
    "psycopg[binary]",
    # Only for linear_sum_assignment: pairing a chart's placeholders with a query's
    # columns is an assignment problem, and a solver of its own is more code than the
    # dependency is worth. See analytics/bindings.py.
    "scipy",
    "whitenoise",
]
