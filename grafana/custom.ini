# Grafana's server configuration: only what this system sets differently from Grafana's
# defaults, which Grafana reads first from its own conf/defaults.ini and then overrides
# with this file. Every option is documented at
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/.
#
# Never put secret values in this file: it is tracked in version control. Reference a
# podman secret instead with $__file{/run/secrets/...}, the pattern the PostgreSQL data
# source uses for its password. A runtime setting arrives as $__env{...} from runtime.env
# through the quadlet's EnvironmentFile; a build-time one as ${...}, which render.sh
# substitutes from buildtime.env before the file is copied into the image.
#
# Logging stays as GF_* environment in quadlets/grafana.container: the image's entrypoint
# passes log.mode on the command line, which overrides whatever this file says.

[server]
# The public host name, from runtime.env. Grafana defaults it to "localhost" and builds
# root_url from it, out of which it makes every absolute address it hands out -- the MCP
# address on the assistant dashboard among them.
domain = $__env{SERVER_NAME}

[dashboards]
# Our own home page. Grafana's built-in one has a "Basics" panel whose cards are compiled
# into the frontend bundle, so a card cannot be added to it; this replaces the page instead.
# The path is where the Dockerfile's COPY of provisioning/ puts it.
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/home.json

[users]
# The system-wide setting from runtime.env, shared with the admin panel and the notebooks;
# a person's own preference, set in their profile, still wins.
default_theme = $__env{DEFAULT_THEME}

[auth]
# There is no login here to show: the proxy signs a visitor in on the admin panel's say-so
# (see [auth.proxy]). Left visible, the form would take a password Grafana cannot check.
disable_login_form = true
# Signing out of Grafana alone would do nothing: the next request brings the proxy's
# headers back and signs the visitor straight in again. The session that counts is the
# admin panel's, and its sign-out is a button rather than an address -- a link must not be
# able to sign someone out -- so Grafana's "sign out" leads to the admin panel, where that
# button is one click away and, with single sign-on on, ends the provider's session in
# turn.
signout_redirect_url = /${CRUDMAN_PATH}/

[auth.proxy]
# The visitor is whoever the proxy says: it asks the admin panel about the session cookie
# on every request and passes the answer on in these headers, so Grafana shares the admin
# panel's accounts, its sign-in and its single sign-on without a client of its own. The
# role too, so what a person may do here is decided in one place, by their rank.
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
headers = Name:X-WEBAUTH-NAME Email:X-WEBAUTH-EMAIL Role:X-WEBAUTH-ROLE
# The loopback only, which inside the pod is the proxy and the MCP server -- and the MCP
# server strips this header before forwarding (see proxy/locations.conf.template). Port
# 3000 is not published, so nothing else can reach here at all.
whitelist = 127.0.0.1
# Grafana keeps a session of its own beside the headers. Not for signing anyone in --
# the headers do that on every request, and a browser without the admin panel's session
# never reaches Grafana at all, the proxy turning it away first -- but because Grafana's
# frontend rotates its session token on every page load and treats the 401 it gets when
# there is none as "signed out", reloading the page without end.
enable_login_token = true
