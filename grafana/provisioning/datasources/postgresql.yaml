# Provisions the project's PostgreSQL database as a read-only Grafana data source.
# The password is read from the podman secret mounted into the container, named by
# SECRET_GRAFANA_PASSWORD in buildtime.env and substituted in by grafana/render.sh.
apiVersion: 1

datasources:
  # The name and uid are interpolated from APP_NAME at build time by
  # grafana/render.sh, so they track the project name from buildtime.env. The login role
  # comes from the same file (GRAFANA_DB_USER), which is what the database init scripts
  # create and grant read access to.
  - name: ${APP_NAME}
    type: postgres
    uid: ${APP_NAME}-postgresql
    access: proxy
    url: postgresql:5432
    user: ${GRAFANA_DB_USER}
    isDefault: true
    jsonData:
      database: ${PG_DATABASE}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $__file{/run/secrets/${SECRET_GRAFANA_PASSWORD}}
