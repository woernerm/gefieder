# The project's PostgreSQL database as a read-only Grafana data source. The password comes
# from the podman secret named by SECRET_GRAFANA_PASSWORD, substituted by
# grafana/render.sh.
apiVersion: 1

datasources:
  # Name and uid come from APP_NAME, the login role from GRAFANA_DB_USER, so both track
  # buildtime.env -- the same file the init scripts created that role from.
  - name: ${APP_NAME}
    type: postgres
    uid: ${APP_NAME}-postgresql
    access: proxy
    url: postgresql:5432
    user: ${GRAFANA_DB_USER}
    isDefault: true
    jsonData:
      database: ${PG_DATABASE}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $__file{/run/secrets/${SECRET_GRAFANA_PASSWORD}}

  # The same database as far as a dashboard can tell: the preview database holds the same
  # schema names, each pointing either at the version under review or, where that version
  # changes nothing, at production (postgresql/initdb/gf_0009). So a panel's SQL is
  # identical in both and a dashboard needs no preview of its own.
  #
  # Nobody picks this data source. The proxy substitutes its uid for the one above in
  # Grafana's answers while a reviewer is deciding, and puts it back when they have
  # (proxy/locations.conf.template).
  - name: ${APP_NAME} (preview)
    type: postgres
    uid: ${APP_NAME}-preview
    access: proxy
    url: postgresql:5432
    user: ${GRAFANA_DB_USER}
    jsonData:
      database: ${PG_DATABASE}_preview
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $__file{/run/secrets/${SECRET_GRAFANA_PASSWORD}}
