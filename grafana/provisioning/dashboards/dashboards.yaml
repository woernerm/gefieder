# The dashboards shipped with the image: Grafana scans the folder below at startup and
# while running, loading every dashboard JSON it finds.
apiVersion: 1

providers:
  - name: ${APP_NAME}
    type: file
    # A user's saved change survives the next scan; the files on disk stay the defaults.
    allowUiUpdates: true
    options:
      # Baked in by the Dockerfile's COPY of grafana/provisioning/.
      path: /etc/grafana/provisioning/dashboards
      # The folder comes from the directory the JSON sits in, so dashboards/Default/ lands
      # in a "Default" folder. Unlike a static `folder:` key this also re-homes a dashboard
      # an earlier image provisioned into the root. A JSON directly in `path` lands in the
      # root "General" folder.
      foldersFromFilesStructure: true

  # The dashboards whose text the entrypoint rewrites at start, because it carries a value
  # only known then: the assistant instructions print the MCP address, built from the
  # runtime SERVER_NAME and DEBUG. It reads them from provisioning/dashboards-runtime/ and
  # writes the substituted copies here, which is why this path is under the data volume.
  - name: ${APP_NAME}-runtime
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards-runtime
      foldersFromFilesStructure: true
