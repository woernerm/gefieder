name: Build and release

# Build the five custom images with docker, render the quadlets and publish everything as a
# GitHub release: one tarball per image, one file per quadlet, plus install.sh, which a
# server then runs without a checkout.
#
# Triggered by every commit to main, and runnable manually with an explicit tag.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. 26.7.3). Leave empty for the next calendar version."
        required: false

permissions:
  contents: write   # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA (v5.0.0), so a moved tag cannot change what runs.
      # fetch-depth: 0 brings the tags the calendar version below counts.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      # The explicit tag from a manual run, otherwise a calendar version YY.M.x. The month
      # resets the counter, and x is the highest patch already released for that YY.M plus
      # one, so a re-run cannot collide with an earlier release.
      - name: Resolve the release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"
            exit 0
          fi

          PREFIX="$(date +%y).$(date +%-m)"

          # --sort=-v:refname would order 11 before 2, so compare numerically.
          LAST="$(git tag --list "${PREFIX}.*" \
            | sed -n "s/^${PREFIX}\.\([0-9][0-9]*\)$/\1/p" \
            | sort -n | tail -n 1)"

          echo "TAG=${PREFIX}.$(( ${LAST:-0} + 1 ))" >> "$GITHUB_ENV"

      # So the build args and the rendered quadlets use the same values. Sourced rather
      # than grepped into $GITHUB_ENV: CERTIFICATE_PATH references ${APP_NAME} in shell
      # syntax, which only a shell resolves. Only the KEY=value names are then forwarded,
      # each with its resolved value. envsubst renders the quadlet templates below.
      - name: Load buildtime.env
        run: |
          set -a
          source buildtime.env
          set +a
          for var in $(grep -oE '^[A-Z_][A-Z0-9_]*=' buildtime.env | cut -d= -f1); do
            echo "${var}=${!var}" >> "$GITHUB_ENV"
          done
          sudo apt-get update && sudo apt-get install -y gettext-base

      # The same script local builds use, so CI and a developer build identically.
      - name: Build the images
        run: ./build.sh

      # Every release asset in dist/: one tarball per image, one file per quadlet, the
      # rendered manifest the installer sources, and the installer itself.
      - name: Stage the release assets
        run: |
          mkdir -p dist
          for svc in postgresql crudman sqlmesh proxy grafana grafana_mcp; do
            docker save "${REGISTRY}/${svc}:${IMAGE_TAG}" -o "dist/${svc}.tar"
          done

          # Only the known tokens, so nginx's $host and Grafana's %(domain)s survive.
          VARS='${REGISTRY} ${IMAGE_TAG} ${APP_NAME} ${SUPERUSER_NAME} ${SUPERUSER_EMAIL} ${CRUDMAN_PATH} ${GRAFANA_PATH} ${MCP_PATH} ${CERTIFICATE_PATH} ${SERVER_STATS_INTERVAL} ${SERVER_STATS_SCHEMA} ${PG_DATABASE} ${CRUDMAN_DB_USER} ${SQLMESH_DB_USER} ${DB_USER_PREFIX} ${ROLE_PREFIX} ${BRONZE_SCHEMA_PREFIX} ${SECRET_SUPERUSER_PASSWORD} ${SECRET_CRUDMAN_PASSWORD} ${SECRET_SQLMESH_PASSWORD} ${SECRET_GRAFANA_PASSWORD} ${SECRET_DJANGO_KEY} ${SECRET_OIDC_CLIENT}'
          for f in quadlets/* serverstats/server-stats.service serverstats/server-stats.timer; do
            envsubst "$VARS" < "$f" > "dist/$(basename "$f")"
          done

          # These ship verbatim, next to the rendered units.
          cp serverstats/collect.sh dist/collect.sh
          cp runtime.env dist/runtime.env

          # What the installer sources for the values baked into the images.
          {
            echo "APP_NAME=${APP_NAME}"
            echo "SUPERUSER_NAME=${SUPERUSER_NAME}"
            echo "SUPERUSER_DEFAULT_PASSWORD=${SUPERUSER_DEFAULT_PASSWORD}"
            echo "CRUDMAN_PATH=${CRUDMAN_PATH}"
            echo "GRAFANA_PATH=${GRAFANA_PATH}"
            echo "MCP_PATH=${MCP_PATH}"
            echo "SERVER_STATS_SCHEMA=${SERVER_STATS_SCHEMA}"
            echo "PG_DATABASE=${PG_DATABASE}"
            echo "SECRET_SUPERUSER_PASSWORD=${SECRET_SUPERUSER_PASSWORD}"
            echo "SECRET_CRUDMAN_PASSWORD=${SECRET_CRUDMAN_PASSWORD}"
            echo "SECRET_SQLMESH_PASSWORD=${SECRET_SQLMESH_PASSWORD}"
            echo "SECRET_GRAFANA_PASSWORD=${SECRET_GRAFANA_PASSWORD}"
            echo "SECRET_DJANGO_KEY=${SECRET_DJANGO_KEY}"
            echo "SECRET_OIDC_CLIENT=${SECRET_OIDC_CLIENT}"
          } > dist/manifest.env

          # The installer runs standalone from the release, so neither can come from
          # buildtime.env, and TEMPDIR is needed before manifest.env lands in it. Only
          # these two are substituted, the installer's own $WORK and $BASE surviving. REPO
          # has no default, so this fails rather than publishing an empty download URL.
          if [ -z "${REPO}" ]; then
            echo "REPO is not set in buildtime.env; set it to this repository's URL." >&2
            exit 1
          fi
          envsubst '${REPO} ${TEMPDIR}' < install.sh > dist/install.sh

          # It downloads nothing, discovering what to remove from the installed files.
          cp uninstall.sh dist/uninstall.sh

      # --latest moves the pointer ${REPO}/releases/latest/download/... resolves to.
      # Without it gh sorts tags as semver, where 26.7.2 outranks 26.12.11.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --latest
