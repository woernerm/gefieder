[project]
name = "sqlmesh-service"
version = "0.1.0"
description = "The SQLMesh analytics engine for the analytics platform."
requires-python = ">=3.13"
# sqlmesh's postgres extra is deliberately unused: it depends on psycopg2, which must be
# compiled against libpq, while psycopg2-binary is the same module as a prebuilt wheel.
#
# polars is what the Project C bronze model transforms its raw data with.
#
# duckdb 2.0.1 is the first whose postgres extension runs a query reading only the attached
# database entirely in PostgreSQL, which is what the duckdb gateway attaches. Pinned so the
# engine and the notebooks run the same DuckDB; a new release also waits for the community
# extensions in DUCKDB_EXTENSIONS to be built for it.
dependencies = ["sqlmesh[lsp,github,web]", "psycopg2-binary", "polars", "duckdb==2.0.1"]

# sqlmesh still caps duckdb<2. Drop this once it lifts the cap.
[tool.uv]
override-dependencies = ["duckdb==2.0.1"]
